name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: shop
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e                      # остановиться на первой ошибке
            source ~/.nvm/nvm.sh        # без этого не найдутся node, npm, pm2

            cd ~/app
            git pull

            cd api
            npm ci
            pm2 restart shop-api

            cd ../front
            npm ci
            npm run build